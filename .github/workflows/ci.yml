name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pruebas
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: solo-pruebas-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pruebas -d pruebas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://pruebas:solo-pruebas-ci@localhost:5432/pruebas
    defaults:
      run:
        working-directory: servidor
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: servidor/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
      - name: Construir y comprobar la imagen de Cloud Run
        run: |
          docker build -t procesos26-27-ci ..
          docker run --detach --name procesos26-27-ci --env PORT=8080 --env NODE_ENV=test --publish 127.0.0.1:8080:8080 procesos26-27-ci
          for intento in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/api/salud; then
              curl --fail --silent http://127.0.0.1:8080/ > /tmp/prototipo.html
              node -e "require('node:assert/strict').ok(require('node:fs').readFileSync('/tmp/prototipo.html', 'utf8').includes('Gestión de usuarios'))"
              exit 0
            fi
            sleep 2
          done
          docker logs procesos26-27-ci
          exit 1
