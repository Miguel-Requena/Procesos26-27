name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # MongoDB 8.0 no arranca con el kernel >= 6.19 de Ubuntu 26.
    # Fijar el runner evita cambios de sistema durante la entrega.
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_TEST_URL: mongodb://localhost:27017/pruebas_procesos
    defaults:
      run:
        working-directory: servidor
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: servidor/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
      - name: Comprobar contenedor de Cloud Run con MongoDB real
        run: |
          docker build -t procesos26-27-ci ..
          docker run --detach --name procesos26-27-ci --network host --env PORT=8080 --env NODE_ENV=test --env DATABASE_URL=mongodb://127.0.0.1:27017/pruebas_contenedor procesos26-27-ci
          for intento in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/api/salud; then
              curl --fail --silent http://127.0.0.1:8080/ > /tmp/prototipo.html
              node -e "require('node:assert/strict').ok(require('node:fs').readFileSync('/tmp/prototipo.html', 'utf8').includes('Gestión de usuarios'))"
              exit 0
            fi
            sleep 2
          done
          docker logs procesos26-27-ci
          exit 1
