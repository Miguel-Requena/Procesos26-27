name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Desplegar en Render
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
      - name: Avisar si falta configurar el despliegue
        if: ${{ env.RENDER_DEPLOY_HOOK == '' }}
        run: echo "El despliegue se gestiona con la integración GitHub de Render."
